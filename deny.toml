# What Kamosu checks its Rust dependencies for, and what it has decided to live
# with. Run it with `just audit` — never folded into `just check`, because this
# one needs the network to fetch the RustSec advisory database and `just check`
# must stay fast and work on a train.
#
# Only `advisories` is configured, and `just audit` asks for only that check.
# The licenses, bans and sources checks are deliberately left alone: each wants
# a decision per crate in the tree, which is its own afternoon and not this
# one. A bare `cargo deny check` runs all four and will fail on licenses with
# nothing allowed — that is the empty config talking, not a real finding.
#
# Why this exists at all: Kamosu decodes photographs it did not take, fetches
# pages it was told about by text it was told to read (ADR 0033), and hashes
# passwords. Advisories in that tree are worth knowing about the week they are
# published rather than the year.

[advisories]
# Empty, and worth keeping that way.
#
# An id belongs here only when an advisory has been read and judged not to
# apply, or judged unfixable — never to quiet a build. Write the reason next to
# the id when you add one, and re-read it whenever the dependency moves.
#
# The first run of this gate found RUSTSEC-2024-0436, unmaintained `paste`,
# arriving twice under `image`. It was nearly recorded here as unfixable. It
# was not: `image` was pulling every format it knows how to build, and the two
# that dragged `paste` in were an AVIF encoder Kamosu can never reach and
# OpenEXR. Scoping the feature list in Cargo.toml removed it from the build
# outright — read that file's comment for the reasoning. cargo-deny resolves
# features, so the advisory is gone rather than silenced.
#
# Reach for the real fix first. This list is for what survives it.
ignore = []
