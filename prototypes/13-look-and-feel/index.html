<!doctype html>
<!--
  PROTOTYPE — throwaway. Kamosu issue #13.
  Three directions for what Kamosu looks and feels like, switchable with ?v=a|b|c
  and the floating bar at the bottom. Each direction is its own look AND its own
  answer to the cooking screen. Nothing here is production code.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kamosu — look &amp; feel prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link id="vcss" rel="stylesheet" href="a.css">
  <style>
    /* Shell only — never part of a design being judged. */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
    #app { min-height: 100%; }
    #bar {
      position: fixed; z-index: 9999; left: 50%; top: 8px;
      transform: translateX(-50%); display: flex; align-items: center; gap: 2px;
      background: #101014; color: #fff; border: 1px solid #3a3a44; border-radius: 999px;
      padding: 4px; box-shadow: 0 8px 30px rgba(0,0,0,.45); font: 500 13px/1 ui-sans-serif, system-ui, sans-serif;
      opacity: .93;
    }
    #bar button { font: inherit; background: none; border: 0; color: #fff; cursor: pointer;
      padding: 8px 11px; border-radius: 999px; }
    #bar button:hover { background: #2a2a33; }
    #bar .lbl { padding: 0 10px; white-space: nowrap; letter-spacing: .01em; }
    @media (max-width: 560px) { #bar .lbl em { display: none; } #bar button { padding: 8px 9px; } }
    #bar .lbl b { font-weight: 700; }
    #bar .lbl em { font-style: normal; }
    #bar .sep { width: 1px; align-self: stretch; background: #3a3a44; margin: 3px 4px; }
    #bar .scr[aria-current="true"] { background: #fff; color: #101014; }
    #bar.tucked { opacity: .18; }
    #bar.tucked:hover { opacity: .95; }
    @media (prefers-reduced-motion: no-preference) { #bar { transition: opacity .25s; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="bar" role="group" aria-label="Prototype variant switcher"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
