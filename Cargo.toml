[package]
name = "kamosu"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5.3", features = ["password-hash", "rand"] }
axum = "0.8.9"
base64 = "0.23.1"
caseless = "0.2.2"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
image = { version = "0.25.10", features = ["jpeg", "png", "gif", "bmp", "webp"] }
iso8601-duration = "0.2.0"
rand = { version = "0.10.2", features = ["sys_rng"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
reqwest-ssrf-guard = "0.1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
scraper = "0.27.0"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
webp = "0.3.1"

[features]
# Adds `probe_job`, a demonstration Job Operation, so the behaviour suite can
# drive the whole Job shape — ask, poll, fail, the two lanes — end-to-end through
# real Doors. Production builds leave it out: no synthetic Operations ship; the
# first Jobs arrive with Import, Sheet rendering and Meaning Search.
test-jobs = []

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time"] }
zip = "8.6.0"
